                <p class="welcome-subtitle" data-i18n="welcome.subtitle">Dice Game Scorer</p>
                <p class="welcome-description" data-i18n="welcome.description">Score your offline dice game rounds with ease</p>
            </div>

            <div class="language-selector-container">
                <select id="language-selector" class="language-selector">
                    <option value="en" data-i18n="language.english">English</option>
                    <option value="pl" data-i18n="language.polish">Polski</option>
                </select>
            </div>

            <div class="btn-column">
                <button id="welcome-start" class="btn-primary btn-full" data-i18n="welcome.start">New Game</button>

            </div>
        </div>
    </template>

    <!-- Screen: Player Setup (count + names merged) -->
    <template id="screen-player-setup">
        <div class="screen">
            <h1 data-i18n="playerSetup.selectPlayers">Select number of players</h1>
            <div class="player-buttons">
                <button class="player-btn" data-players="2">2</button>
                <button class="player-btn" data-players="3">3</button>
                <button class="player-btn" data-players="4">4</button>
                <button class="player-btn" data-players="5">5</button>
            </div>

            <div id="player-inputs"></div>

            <button id="start-game" class="btn-primary btn-full" disabled data-i18n="playerSetup.continue">Continue</button>
        </div>
    </template>

            <div class="progress-bar">
                <div id="splash-timer-progress"></div>
            </div>
        </div>
    </template>

    <!-- Screen 3: Scorecard Preview -->
    <template id="screen-scorecard">
        <div class="screen">
            <div class="scorecard-header">
                <h2 id="player-name">Player Name</h2>
                <div id="round-info">Round 1</div>
            </div>
            <div id="scorecard-table" class="scorecard-table"></div>
            <div class="btn-row">
                <button id="scorecard-quit" class="btn-quit">X</button>
                <button id="proceed-to-dice" class="btn-primary btn-full" data-i18n="scorecard.continue">Continue</button>
            </div>
        </div>
    </template>

    <!-- Screen 4-5: Dice Selection & Scoring -->
    <template id="screen-gameplay">
        <div class="screen">
            <div class="gameplay-header">
                <h2 id="gameplay-player-name">Player Name</h2>
                <div id="gameplay-round-info">Round 1</div>
            </div>

            <div class="dice-selector">
                <h3 class="combinations-title" data-i18n="gameplay.selectDice">Select your dice:</h3>
                <div id="dice-grid"></div>
            </div>

            <div id="combinations-section">
                <h3 class="combinations-title" id="combinations-title" data-i18n="gameplay.availableCombinations">Available combinations</h3>
                <div id="combinations-list"></div>
            </div>

            <div class="btn-row">
                <button id="gameplay-quit" class="btn-quit">X</button>
                <button id="save-round" class="btn-primary btn-full" disabled data-i18n="gameplay.continue">Continue</button>
            </div>
        </div>
    </template>

    <!-- Screen 5a: Joker Selection (Yahtzee Bonus) -->
    <template id="screen-joker-selection">
        <div class="screen">
            <div class="gameplay-header">
                <h2 id="joker-player-name">Player Name</h2>
                <div id="joker-round-info">Round 1</div>
            </div>

            <div class="joker-info">
                <h3 data-i18n="joker.bonusHeading">🎉 Yahtzee Bonus!</h3>
                <p id="joker-bonus-text" data-i18n="joker.bonusInfo">Bonus: +100 points</p>
                <p data-i18n="joker.placeText">Select where to place this dice combination:</p>
            </div>

            <div id="joker-options-section">
                <div id="joker-options-list"></div>
            </div>

            <div class="btn-row">
                <button id="joker-quit" class="btn-quit">X</button>
                <button id="joker-confirm" class="btn-primary btn-full" disabled data-i18n="joker.continue">Continue</button>
            </div>
        </div>
    </template>
